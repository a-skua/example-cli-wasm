name: Release

on:
  push:
    branches:
      - main

permissions: {}

jobs:
  version-bump:
    runs-on: ubuntu-latest
    if: "!startsWith(github.event.head_commit.message, 'chore: bump version')"
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6

      - id: version
        env:
          TZ: Asia/Tokyo
        run: echo "version=$(date +'%Y.%-m.%-d')" >> "$GITHUB_OUTPUT"

      - run: sed -Ei "s/^version\s*=\s*\".*\"/version = \"${{ steps.version.outputs.version }}\"/" Cargo.toml

      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock
          git commit -m "chore: bump version to ${{ steps.version.outputs.version }}" || exit 0
          git push

  build:
    needs: version-bump
    runs-on: ubuntu-latest
    outputs:
      short-sha: ${{ steps.sha.outputs.short-sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - id: sha
        run: echo "short-sha=$(git rev-parse --short=4 HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-

      - run: rustup target add wasm32-wasip2

      - run: curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/1800853f2578f8c34492ec76154caef8e163fbca/install-from-binstall-release.sh | bash # v1.17.7
        env:
          BINSTALL_VERSION: 1.17.7

      - run: cargo binstall -y wkg@0.15.0 wac-cli@0.9.0

      - run: make build

      - uses: actions/upload-artifact@v7
        with:
          name: example-cli-wasm
          path: target/wasm32-wasip2/release/composed-example-cli.wasm

  publish:
    needs: [version-bump, build]
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: example-cli-wasm

      - run: curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/1800853f2578f8c34492ec76154caef8e163fbca/install-from-binstall-release.sh | bash # v1.17.7
        env:
          BINSTALL_VERSION: 1.17.7

      - run: cargo binstall wkg@0.15.0 -y

      - run: |
          wkg oci push \
            -u ${{ github.actor }} \
            -p ${{ secrets.GITHUB_TOKEN }} \
            ghcr.io/a-skua/example-cli:${{ needs.version-bump.outputs.version }} \
            composed-example-cli.wasm

  release:
    needs: [version-bump, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: example-cli-wasm

      - env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version-bump.outputs.version }}+${{ needs.build.outputs.short-sha }}
        run: |
          gh release create "$VERSION" \
            composed-example-cli.wasm \
            --repo "${{ github.repository }}" \
            --title "$VERSION" \
            --generate-notes
